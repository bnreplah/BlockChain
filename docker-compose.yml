# Multi-container DARM-ANN cluster — three nodes, each serving its own memory
# network + operator dashboard, with persistent snapshots.
#
#   docker compose up --build
#   open  http://localhost:3001/darm/dashboard   (also :3002, :3003)
#   driver:  docker compose exec darm1 node darm-ann/cli.js state
#
# Each node is an independent DARM-ANN replica (own LTM blockchain). They can be
# joined into one logical network via cross-chain pollination (Swarm) or the
# repo's /register-and-broadcast-node endpoints; membership within a node's
# consensus cluster changes live via the validator endpoints / RSM.

services:
  darm1:
    build: .
    image: darm-ann:latest
    ports: ["3001:3001"]
    environment:
      PORT: "3001"
      NODE_URL: "http://darm1:3001"
      DARM_SNAPSHOT: "/data/node.json"
      DARM_MIN_AGE_MS: "0"
    volumes: ["darm1-data:/data"]
    networks: ["darmnet"]

  darm2:
    build: .
    image: darm-ann:latest
    ports: ["3002:3002"]
    environment:
      PORT: "3002"
      NODE_URL: "http://darm2:3002"
      DARM_SNAPSHOT: "/data/node.json"
      DARM_MIN_AGE_MS: "0"
    volumes: ["darm2-data:/data"]
    networks: ["darmnet"]

  darm3:
    build: .
    image: darm-ann:latest
    ports: ["3003:3003"]
    environment:
      PORT: "3003"
      NODE_URL: "http://darm3:3003"
      DARM_SNAPSHOT: "/data/node.json"
      DARM_MIN_AGE_MS: "0"
    volumes: ["darm3-data:/data"]
    networks: ["darmnet"]

  # Prometheus scrapes /darm/metrics from every node and evaluates alert rules.
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: ["darmnet"]
    depends_on: ["darm1", "darm2", "darm3"]

  # Alertmanager routes firing alerts (webhook receiver by default).
  alertmanager:
    image: prom/alertmanager:latest
    ports: ["9093:9093"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: ["darmnet"]
    depends_on: ["prometheus"]

  # Grafana with a provisioned Prometheus datasource + DARM-ANN dashboard.
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "darm"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: ["darmnet"]
    depends_on: ["prometheus"]

networks:
  darmnet:
    driver: bridge

volumes:
  darm1-data:
  darm2-data:
  darm3-data:
  grafana-data:
