{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "darm-ann.fullname" . }}
  labels: {{- include "darm-ann.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "darm-ann.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # Peer-to-peer + intra-cluster traffic (gossip, port-forward) on the API port.
    - from:
        - podSelector:
            matchLabels: {{- include "darm-ann.selectorLabels" . | nindent 14 }}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
{{- end }}
