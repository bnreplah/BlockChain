# DARM-ANN on Kubernetes — plain manifests (no Helm required).
#   kubectl apply -f deploy/k8s/darm-ann.yaml
# A 3-replica StatefulSet (stable identity + per-pod PVC for the LTM snapshot),
# a headless Service for peer addressing, a client Service, a Secret holding the
# API/cluster tokens, and a Prometheus ServiceMonitor for scraping /darm/metrics.
---
apiVersion: v1
kind: Namespace
metadata:
  name: darm-ann
---
apiVersion: v1
kind: Secret
metadata:
  name: darm-tokens
  namespace: darm-ann
type: Opaque
stringData:
  # Replace these before applying. Operator + read-only + inter-node tokens.
  DARM_TOKENS: "change-me-operator:operator,change-me-read:read"
  DARM_CLUSTER_TOKEN: "change-me-cluster"
---
apiVersion: v1
kind: Service
metadata:
  name: darm-headless
  namespace: darm-ann
  labels: { app: darm-ann }
spec:
  clusterIP: None          # headless → stable DNS per pod (darm-N.darm-headless)
  selector: { app: darm-ann }
  ports:
    - { name: http, port: 3001, targetPort: 3001 }
---
apiVersion: v1
kind: Service
metadata:
  name: darm-ann
  namespace: darm-ann
  labels: { app: darm-ann }
spec:
  type: ClusterIP
  selector: { app: darm-ann }
  ports:
    - { name: http, port: 3001, targetPort: 3001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: darm-ann
  namespace: darm-ann
spec:
  serviceName: darm-headless
  replicas: 3
  selector:
    matchLabels: { app: darm-ann }
  template:
    metadata:
      labels: { app: darm-ann }
    spec:
      terminationGracePeriodSeconds: 20   # allow snapshot-on-shutdown to finish
      containers:
        - name: darm-ann
          image: darm-ann:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          # Self URL uses the stable per-pod DNS name.
          args: ["node app.js 3001 http://$(POD_NAME).darm-headless.darm-ann.svc.cluster.local:3001"]
          ports:
            - { name: http, containerPort: 3001 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: PORT, value: "3001" }
            - { name: DARM_SNAPSHOT, value: "/data/node.json" }
            - { name: DARM_SNAPSHOT_MS, value: "60000" }
            - { name: DARM_MIN_AGE_MS, value: "60000" }
            - { name: DARM_AUDIT_FILE, value: "/data/audit.log" }
            - name: DARM_TOKENS
              valueFrom: { secretKeyRef: { name: darm-tokens, key: DARM_TOKENS } }
            - name: DARM_CLUSTER_TOKEN
              valueFrom: { secretKeyRef: { name: darm-tokens, key: DARM_CLUSTER_TOKEN } }
          readinessProbe:
            httpGet: { path: /darm/health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /darm/health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Prometheus Operator ServiceMonitor (skip if you don't run the operator).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: darm-ann
  namespace: darm-ann
  labels: { app: darm-ann, release: prometheus }
spec:
  selector:
    matchLabels: { app: darm-ann }
  endpoints:
    - port: http
      path: /darm/metrics
      interval: 15s
